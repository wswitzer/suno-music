name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundational-safety-setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply canonical source fixes
        if: "!contains(github.event.head_commit.message, '[canonical-source]')"
        run: python scripts/apply_canonical_json_source_fixes.py
      - run: pip install -e '.[dev]'
      - name: Auto-fix lint
        if: "!contains(github.event.head_commit.message, '[canonical-source]')"
        run: |
          ruff check src tests --fix --unsafe-fixes
          ruff format src tests
      - run: pytest
      - run: ruff check src tests
      - name: Commit canonical source fixes
        if: "!contains(github.event.head_commit.message, '[canonical-source]')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests prompts/PIPELINE_PROMPTS.md AGENTS.md README.md docs/verification_116_125.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Use canonical JSON source for lyric pipeline [canonical-source]"
          git pull --rebase origin agent/foundational-safety-setup
          git push origin HEAD:agent/foundational-safety-setup
