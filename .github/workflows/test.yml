name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/acim-suno-pipeline-starter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply review fixes
        if: "!contains(github.event.head_commit.message, '[review-fixes]')"
        run: python scripts/apply_review_fixes.py
      - run: pip install -e '.[dev]'
      - name: Auto-fix lint
        if: "!contains(github.event.head_commit.message, '[review-fixes]')"
        run: |
          ruff check src tests --fix --unsafe-fixes
          ruff format src tests
      - run: pytest
      - run: ruff check src tests
      - name: Commit review fixes
        if: "!contains(github.event.head_commit.message, '[review-fixes]')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Fix review blockers [review-fixes]"
          git push origin HEAD:agent/acim-suno-pipeline-starter
