name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundational-safety-setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply integrity review fixes
        if: "!contains(github.event.head_commit.message, '[integrity-fixes]')"
        run: |
          python scripts/apply_integrity_review_fixes.py
          python scripts/post_integrity_review_fix.py
      - run: pip install -e '.[dev]'
      - name: Auto-fix lint
        if: "!contains(github.event.head_commit.message, '[integrity-fixes]')"
        run: |
          ruff check src tests --fix --unsafe-fixes
          ruff format src tests
      - run: pytest
      - run: ruff check src tests
      - name: Commit integrity fixes
        if: "!contains(github.event.head_commit.message, '[integrity-fixes]')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests pyproject.toml prompts/PIPELINE_PROMPTS.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Fix pipeline source and scoring integrity [integrity-fixes]"
          git push origin HEAD:agent/foundational-safety-setup
