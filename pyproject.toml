[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acim-suno-pipeline"
version = "0.1.0"
description = "Reproducible ACIM lesson-to-Suno style assignment and lyric pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
gemini = ["google-genai>=1.51.0"]
openai = ["openai>=1.0"]

[project.scripts]
acim-suno = "acim_suno.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acim_suno"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
